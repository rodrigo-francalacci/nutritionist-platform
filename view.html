<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B25D4">
<title>Plano alimentar</title>
<style>
  :root{
    --cor1:#0A0A0B; --cor2:#0B25D4; --cor3:#41BAA4; --cor4:#ABDAFC;
    --cor5:#E5FCFF; --cor6:#EDEAE8; --cor7:#080824; --cor8:#E23E49;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:#f2f4f8; color:var(--cor1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body{ padding-bottom:84px; }        /* espaço p/ a barra fixa */
  .topo{ background:var(--cor7); color:#fff; padding:16px 16px 14px; }
  .topo h1{ margin:0; font-size:20px; }
  .topo .sub{ margin-top:2px; font-size:13px; color:var(--cor4); }
  .topo .geral{ margin-top:8px; font-size:13px; line-height:1.4; color:#dfe6ff; }

  .aviso{ padding:40px 20px; text-align:center; color:#666; }

  .periodo{ margin:12px 10px; background:#fff; border-radius:14px; overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .p-cab{ display:flex; align-items:center; gap:8px; padding:10px 12px; }
  .p-nome{ font-weight:800; font-size:16px; }
  .cab-manha{ background:var(--cor5); }
  .cab-almoco{ background:var(--cor4); }
  .cab-tarde{ background:var(--cor3); }
  .cab-noite{ background:var(--cor2); color:#fff; }
  .p-tot{ margin-left:auto; font-size:13px; font-weight:700; opacity:.9; white-space:nowrap; }

  .alt-barra{ display:flex; align-items:center; gap:8px; padding:4px 12px 2px; font-size:13px; color:#333; }
  .cab-noite ~ .alt-barra{}
  .alt-seta{ border:none; background:rgba(0,0,0,.06); color:#333; border-radius:50%;
    width:26px; height:26px; font-size:14px; line-height:1; cursor:pointer; flex:0 0 auto; }
  .alt-seta:disabled{ opacity:.3; }
  .alt-nome{ font-weight:700; flex:1 1 auto; text-align:center; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .alt-cont{ color:#888; font-size:12px; }
  .dots{ display:flex; gap:5px; justify-content:center; padding:2px 0 6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:#cdd3dd; }
  .dot.on{ background:var(--cor2); width:16px; border-radius:4px; }

  .vp{ overflow:hidden; touch-action:pan-y; }        /* viewport do carrossel */
  .track{ display:flex; will-change:transform; }
  .slide{ flex:0 0 100%; min-width:100%; padding:2px 0 4px; }
  .food{ display:flex; align-items:baseline; gap:10px; padding:9px 14px; border-top:1px solid #f0f2f6;
    cursor:pointer; }
  .food:first-child{ border-top:none; }
  .food .n{ font-size:16px; }
  .food .q{ margin-left:auto; font-size:15px; font-weight:700; color:var(--cor2); white-space:nowrap; }
  .food.livre .q{ color:#777; font-weight:600; font-style:italic; }
  .food .ed{ color:#c3c9d4; font-size:15px; flex:0 0 auto; }
  /* alimento que o cliente trocou ou mediu diferente */
  .food.mudou{ background:#fffdf3; }
  .food.mudou .n::after{ content:"ajustado"; margin-left:8px; font-size:10px; font-weight:700;
    color:#a07800; background:#ffefc2; padding:1px 6px; border-radius:8px; vertical-align:middle;
    text-transform:uppercase; letter-spacing:.04em; }

  /* folha de ajuste (trocar alimento / mudar quantidade) */
  .aj-macros{ color:#666; font-size:13px; margin:2px 0 4px; }
  .aj-qtd{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .aj-b{ width:44px; height:44px; flex:0 0 auto; border:1px solid var(--cor4); background:var(--cor5);
    color:var(--cor2); font-size:22px; line-height:1; border-radius:10px; cursor:pointer; }
  .aj-b:active{ background:var(--cor4); }
  .aj-i{ width:96px; padding:10px; font-size:17px; text-align:center; border:1px solid var(--cor4);
    border-radius:10px; }
  .aj-u{ font-size:15px; color:#555; }
  .aj-subs{ display:flex; flex-direction:column; gap:6px; }
  .aj-sub{ display:flex; align-items:baseline; gap:10px; text-align:left; width:100%;
    padding:11px 12px; border:1px solid var(--cor4); background:#fff; border-radius:10px;
    font-size:15px; cursor:pointer; }
  .aj-sub small{ margin-left:auto; color:#777; font-size:12px; white-space:nowrap; }
  .aj-sub.on{ border-color:var(--cor2); background:var(--cor5); font-weight:700; }
  .aj-reset{ margin-top:14px; width:100%; padding:11px; border:1px solid var(--cor8);
    background:#fff; color:var(--cor8); border-radius:10px; font-size:15px; cursor:pointer; }
  .slide-vazio{ padding:18px 14px; color:#999; font-size:14px; }
  .toque{ text-align:center; font-size:12px; color:#9aa2b1; padding:4px 0 8px; }

  .barra{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--cor7);
    color:#fff; display:flex; justify-content:space-around; padding:10px 8px;
    box-shadow:0 -2px 12px rgba(0,0,0,.3); }
  .barra .m{ text-align:center; }
  .barra .m b{ display:block; font-size:17px; }
  .barra .m span{ font-size:11px; color:var(--cor4); text-transform:uppercase; letter-spacing:.03em; }

  /* modal de instruções */
  .modal{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:none; }
  .modal.on{ display:block; }
  .folha{ position:absolute; left:0; right:0; bottom:0; max-height:88%; overflow:auto;
    background:#fff; border-radius:16px 16px 0 0; padding:16px 18px 28px; }
  .folha h2{ margin:2px 0 2px; font-size:18px; }
  .folha .sub{ color:#777; font-size:13px; margin-bottom:12px; }
  .folha .lista{ margin:0 0 14px; }
  .folha .li{ display:flex; gap:10px; padding:6px 0; border-bottom:1px solid #f0f2f6; font-size:15px; }
  .folha .li .q{ margin-left:auto; font-weight:700; color:var(--cor2); }
  .folha .rot{ font-weight:800; font-size:13px; color:var(--cor2); text-transform:uppercase;
    letter-spacing:.04em; margin:10px 0 6px; }
  .folha p{ margin:0 0 10px; line-height:1.5; font-size:15px; }
  .folha .fechar{ position:sticky; top:0; float:right; border:none; background:#eef1f6;
    width:34px; height:34px; border-radius:50%; font-size:20px; cursor:pointer; }
  .puxador{ width:40px; height:4px; background:#d7dbe3; border-radius:2px; margin:0 auto 12px; }
</style>
</head>
<body>
  <div id="app"><div class="aviso">Carregando o plano…</div></div>

  <div class="barra" id="barra" style="display:none">
    <div class="m"><b id="b-prot">0</b><span>Proteína</span></div>
    <div class="m"><b id="b-carb">0</b><span>Carbo</span></div>
    <div class="m"><b id="b-gord">0</b><span>Gordura</span></div>
    <div class="m"><b id="b-cal">0</b><span>Calorias</span></div>
  </div>

  <div class="modal" id="modal">
    <div class="folha" id="folha"></div>
  </div>

<script>
(function(){
  var PERIODOS = ["Manhã","Almoço","Tarde","Noite"];
  var SLUG = { "Manhã":"manha","Almoço":"almoco","Tarde":"tarde","Noite":"noite" };
  var view = {};   // { periodo: {ativa, lista:[{titulo, notas, itens, totais}]} }

  function num(v){ var n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; }
  function rd(n){ return Math.round(n*10)/10; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function param(k){ try { return new URLSearchParams(location.search).get(k); } catch(e){ return null; } }

  function totaisDe(itens){
    var t = {cal:0,protein:0,carb:0,fats:0};
    (itens||[]).forEach(function(it){
      t.cal += num(it.cal); t.protein += num(it.protein); t.carb += num(it.carb); t.fats += num(it.fats);
    });
    return {cal:rd(t.cal), protein:rd(t.protein), carb:rd(t.carb), fats:rd(t.fats)};
  }

  // aceita v2 (estado.periodos) e o formato antigo (itens[] achatado)
  function normalizar(estado){
    var out = {};
    if (estado.periodos && typeof estado.periodos === "object"){
      PERIODOS.forEach(function(p){
        var src = estado.periodos[p];
        var lista = (src && Array.isArray(src.lista) && src.lista.length) ? src.lista : [{titulo:"Opção 1", notas:[], itens:[]}];
        out[p] = {
          ativa: Math.min(Math.max(0, (src && src.ativa)|0), lista.length-1),
          lista: lista.map(function(a,i){ return {
            titulo: (a && a.titulo) ? String(a.titulo) : ("Opção "+(i+1)),
            notas: (a && Array.isArray(a.notas)) ? a.notas : [],
            itens: (a && Array.isArray(a.itens)) ? a.itens : [],
            substitutos: (a && Array.isArray(a.substitutos)) ? a.substitutos : [],
            totais: totaisDe(a && a.itens)
          };})
        };
      });
    } else {
      var np = (estado.notasPlano && typeof estado.notasPlano === "object") ? estado.notasPlano : {};
      PERIODOS.forEach(function(p){ out[p] = {ativa:0, lista:[{titulo:"Opção 1", notas:(Array.isArray(np[p])?np[p]:[]), itens:[], substitutos:[], totais:null}]}; });
      (estado.itens||[]).forEach(function(it){ var p = out[it.refeicao] ? it.refeicao : "Manhã"; out[p].lista[0].itens.push(it); });
      PERIODOS.forEach(function(p){ out[p].lista[0].totais = totaisDe(out[p].lista[0].itens); });
    }
    return out;
  }

  function qtdTexto(it){
    if (it.semQtd){ return String(it.qtd||"").trim() || "à vontade"; }
    return (String(it.qtd||"").trim() + " " + (it.unidade||"")).trim();
  }

  function linhasHTML(alt){
    if (!alt.itens.length){ return '<div class="slide-vazio">Nada nesta opção.</div>'; }
    return alt.itens.map(function(it, k){
      return '<div class="food'+(it.semQtd?' livre':'')+(it._mudou?' mudou':'')+'" data-k="'+k+'">'
           + '<span class="n">'+esc(it.nome)+'</span>'
           + '<span class="q">'+esc(qtdTexto(it))+'</span>'
           + '<span class="ed">&#8250;</span></div>';
    }).join("");
  }

  function slideHTML(alt){ return '<div class="slide">'+linhasHTML(alt)+'</div>'; }

  // ---- ajustar um alimento (trocar / mudar a quantidade) ----

  // Macros POR UNIDADE. O plano guarda o total (qtd x unidade) e, quase sempre,
  // o _base com o valor unitário; sem ele, dá para derivar do total/qtd. Fica
  // guardado em _pu na primeira vez: depois do primeiro ajuste o total já mudou
  // e dividir de novo daria outro número.
  function porUnidade(it){
    if (it._pu){ return it._pu; }
    var b = it._base;
    if (b && b.cal != null){
      it._pu = {cal:num(b.cal), protein:num(b.protein), carb:num(b.carb), fats:num(b.fats)};
      return it._pu;
    }
    var q = num(it.qtd);
    if (q > 0){
      it._pu = {cal:num(it.cal)/q, protein:num(it.protein)/q, carb:num(it.carb)/q, fats:num(it.fats)/q};
      return it._pu;
    }
    return null;
  }

  function guardarOriginal(it){
    if (it._orig){ return; }
    it._orig = {nome:it.nome, unidade:it.unidade, qtd:it.qtd, cal:it.cal, protein:it.protein,
                carb:it.carb, fats:it.fats, semQtd:it.semQtd, pu:porUnidade(it)};
  }

  function aplicarQtd(it, q){
    var pu = porUnidade(it);
    if (!pu){ return false; }
    q = Math.max(0, Math.round(q*100)/100);
    it.qtd = String(q);
    it.cal = rd(pu.cal*q); it.protein = rd(pu.protein*q);
    it.carb = rd(pu.carb*q); it.fats = rd(pu.fats*q);
    return true;
  }

  // passo do +/- conforme a ordem de grandeza: 200 g anda de 25 em 25, 2 ovos de meio em meio
  function passo(q){
    if (q >= 100){ return 25; }
    if (q >= 50){ return 10; }
    if (q >= 20){ return 5; }
    if (q >= 5){ return 1; }
    return 0.5;
  }

  function trocar(it, sub){
    if (!sub){ return; }
    guardarOriginal(it);
    var mesmaUnidade = String(sub.unidade||"") === String(it.unidade||"");
    var q = mesmaUnidade ? num(it.qtd) : 1;     // unidade diferente: 200 g -> 200 colheres não faz sentido
    if (!(q > 0)){ q = 1; }
    it.nome = sub.nome;
    it.unidade = sub.unidade || "";
    it.semQtd = false;
    it._pu = {cal:num(sub.cal), protein:num(sub.protein), carb:num(sub.carb), fats:num(sub.fats)};
    aplicarQtd(it, q);
    it._mudou = true;
  }

  function restaurar(it){
    var o = it._orig;
    if (!o){ return; }
    it.nome=o.nome; it.unidade=o.unidade; it.qtd=o.qtd; it.cal=o.cal;
    it.protein=o.protein; it.carb=o.carb; it.fats=o.fats; it.semQtd=o.semQtd;
    it._pu = o.pu;
    it._mudou = false;
    delete it._orig;
  }

  // Redesenha a opção ativa de um período e refaz os totais (do período e do dia).
  function atualizarAlt(p){
    var alts = view[p]; if (!alts || !alts._sec){ return; }
    var i = alts.ativa, alt = alts.lista[i];
    alt.totais = totaisDe(alt.itens);
    var slides = alts._sec.querySelectorAll(".slide");
    if (slides[i]){ slides[i].innerHTML = linhasHTML(alt); }
    atualizarCab(p, alts._sec);
    atualizarTotais();
  }

  function render(estado){
    document.title = estado.nome || "Plano alimentar";
    var app = document.getElementById("app");
    app.innerHTML = "";

    var topo = document.createElement("div");
    topo.className = "topo";
    var geral = (estado.notasPlano && Array.isArray(estado.notasPlano.geral)) ? estado.notasPlano.geral.filter(function(s){return String(s).trim();}) : [];
    topo.innerHTML = '<h1>'+esc(estado.nome||"Plano alimentar")+'</h1>' +
      (estado.notas ? '<div class="sub">'+esc(estado.notas)+'</div>' : "") +
      (geral.length ? '<div class="geral">'+geral.map(esc).join("<br>")+'</div>' : "");
    app.appendChild(topo);

    PERIODOS.forEach(function(p){
      var alts = view[p];
      var temAlgo = alts.lista.some(function(a){ return a.itens.length || (a.notas||[]).some(function(s){return String(s).trim();}); });
      if (!temAlgo){ return; }   // pula período totalmente vazio

      var sec = document.createElement("div");
      sec.className = "periodo";
      sec.setAttribute("data-p", p);
      var n = alts.lista.length;
      sec.innerHTML =
        '<div class="p-cab cab-'+SLUG[p]+'"><span class="p-nome">'+esc(p)+'</span><span class="p-tot" id="ptot-'+SLUG[p]+'"></span></div>' +
        (n>1 ? '<div class="alt-barra"><button class="alt-seta" data-dir="-1">&#8249;</button>'
             + '<span class="alt-nome"></span><button class="alt-seta" data-dir="1">&#8250;</button></div>'
             + '<div class="dots"></div>'
             : '<div class="alt-barra"><span class="alt-nome" style="text-align:center"></span></div>') +
        '<div class="vp"><div class="track">'+alts.lista.map(slideHTML).join("")+'</div></div>' +
        '<div class="toque">toque num alimento para trocar ou mudar a quantidade &middot; toque aqui para as instruções</div>';
      app.appendChild(sec);
      alts._sec = sec;
      montarCarrossel(p, sec);
    });

    document.getElementById("barra").style.display = "flex";
    atualizarTotais();
  }

  function montarCarrossel(p, sec){
    var alts = view[p];
    var n = alts.lista.length;
    var vp = sec.querySelector(".vp");
    var track = sec.querySelector(".track");
    var w = vp.clientWidth;

    function setX(px, anim){ track.style.transition = anim ? "transform .28s ease-out" : "none"; track.style.transform = "translateX("+px+"px)"; }
    function irPara(i, anim){
      alts.ativa = Math.max(0, Math.min(n-1, i));
      setX(-alts.ativa*w, anim);
      atualizarCab(p, sec);
      atualizarTotais();
    }
    sec._irPara = irPara;

    // navegação por setas
    sec.querySelectorAll(".alt-seta").forEach(function(b){
      b.addEventListener("click", function(){ irPara(alts.ativa + parseInt(b.getAttribute("data-dir"),10), true); });
    });

    // arrastar (swipe estilo Instagram) — pointer events cobrem toque e mouse
    var startX=0, startY=0, drag=false, dxTot=0, dyTot=0, base=0, decidiu=false, horiz=false, alvoTap=null;
    vp.addEventListener("pointerdown", function(e){
      w = vp.clientWidth; drag=true; decidiu=false; horiz=false;
      startX=e.clientX; startY=e.clientY; dxTot=0; dyTot=0; base=-alts.ativa*w;
      alvoTap = e.target;      // um toque no alimento ajusta; fora dele, abre as instruções
      setX(base, false);
    });
    vp.addEventListener("pointermove", function(e){
      if (!drag) return;
      dxTot = e.clientX - startX; dyTot = e.clientY - startY;
      if (!decidiu && (Math.abs(dxTot)>6 || Math.abs(dyTot)>6)){ decidiu=true; horiz = Math.abs(dxTot) > Math.abs(dyTot); }
      if (decidiu && horiz && n>1){
        try{ vp.setPointerCapture(e.pointerId); }catch(_){}
        e.preventDefault();
        var off = dxTot;
        // resistência nas pontas
        if ((alts.ativa===0 && off>0) || (alts.ativa===n-1 && off<0)){ off = off*0.35; }
        setX(base + off, false);
      }
    });
    function soltar(){
      if (!drag) return;
      drag=false;
      if (!decidiu || (!horiz && Math.abs(dxTot)<8 && Math.abs(dyTot)<8)){
        if (Math.abs(dxTot)<8 && Math.abs(dyTot)<8){                          // toque
          var f = (alvoTap && alvoTap.closest) ? alvoTap.closest(".food") : null;
          if (f){ abrirAjuste(p, parseInt(f.getAttribute("data-k"), 10)); }
          else { abrirInstrucoes(p); }
        }
        setX(-alts.ativa*w, true);
        return;
      }
      if (horiz && n>1){
        var lim = Math.min(70, w*0.18);
        if (dxTot < -lim) irPara(alts.ativa+1, true);
        else if (dxTot > lim) irPara(alts.ativa-1, true);
        else irPara(alts.ativa, true);
      } else {
        setX(-alts.ativa*w, true);
      }
    }
    vp.addEventListener("pointerup", soltar);
    vp.addEventListener("pointercancel", soltar);

    // a dica fica FORA do .vp, então não passa pelos handlers de toque acima
    var dica = sec.querySelector(".toque");
    if (dica){ dica.addEventListener("click", function(){ abrirInstrucoes(p); }); }

    window.addEventListener("resize", function(){ w = vp.clientWidth; setX(-alts.ativa*w, false); });
    atualizarCab(p, sec);   // preenche o cabeçalho já na carga
    requestAnimationFrame(function(){ w = vp.clientWidth; setX(-alts.ativa*w, false); });
  }

  function atualizarCab(p, sec){
    var alts = view[p]; var n = alts.lista.length; var i = alts.ativa;
    var atual = alts.lista[i];
    var nomeEl = sec.querySelector(".alt-nome");
    if (nomeEl){ nomeEl.textContent = atual.titulo + (n>1 ? "  ("+(i+1)+"/"+n+")" : ""); }
    var tot = document.getElementById("ptot-"+SLUG[p]);
    if (tot){ tot.textContent = atual.totais.cal + " cal"; }
    var setas = sec.querySelectorAll(".alt-seta");
    if (setas[0]) setas[0].disabled = (i===0);
    if (setas[1]) setas[1].disabled = (i===n-1);
    var dots = sec.querySelector(".dots");
    if (dots){
      dots.innerHTML = "";
      for (var k=0;k<n;k++){ var d=document.createElement("span"); d.className="dot"+(k===i?" on":""); dots.appendChild(d); }
    }
  }

  function atualizarTotais(){
    var t = {cal:0,protein:0,carb:0,fats:0};
    PERIODOS.forEach(function(p){
      var a = view[p]; if (!a) return;
      var tt = a.lista[a.ativa].totais;
      t.cal+=tt.cal; t.protein+=tt.protein; t.carb+=tt.carb; t.fats+=tt.fats;
    });
    document.getElementById("b-prot").textContent = rd(t.protein) + "g";
    document.getElementById("b-carb").textContent = rd(t.carb) + "g";
    document.getElementById("b-gord").textContent = rd(t.fats) + "g";
    document.getElementById("b-cal").textContent = rd(t.cal);
  }

  function abrirInstrucoes(p){
    var alts = view[p]; var atual = alts.lista[alts.ativa];
    var foods = atual.itens.map(function(it){
      return '<div class="li"><span>'+esc(it.nome)+'</span><span class="q">'+esc(qtdTexto(it))+'</span></div>';
    }).join("") || '<div class="li">Sem alimentos.</div>';
    var notas = (atual.notas||[]).filter(function(s){return String(s).trim();});
    var instr = notas.length ? notas.map(function(s){ return "<p>"+esc(s)+"</p>"; }).join("") : '<p style="color:#999">Sem instruções para esta opção.</p>';

    document.getElementById("folha").innerHTML =
      '<button class="fechar" onclick="__fechar()">&times;</button>' +
      '<div class="puxador"></div>' +
      '<h2>'+esc(p)+' — '+esc(atual.titulo)+'</h2>' +
      '<div class="sub">'+atual.totais.cal+' cal · '+atual.totais.protein+' g prot · '+atual.totais.carb+' g carb · '+atual.totais.fats+' g gord</div>' +
      '<div class="lista">'+foods+'</div>' +
      '<div class="rot">Instruções</div>' + instr;
    document.getElementById("modal").classList.add("on");
  }
  // ---- folha de ajuste de um alimento ----

  var ajuste = null;   // { p, k } — qual alimento está aberto

  function abrirAjuste(p, k){
    var alts = view[p]; if (!alts){ return; }
    var alt = alts.lista[alts.ativa];
    if (!alt.itens[k]){ return; }
    ajuste = { p:p, k:k };
    renderAjuste();
    document.getElementById("modal").classList.add("on");
  }

  function renderAjuste(){
    if (!ajuste){ return; }
    var alts = view[ajuste.p];
    var alt = alts.lista[alts.ativa];
    var it = alt.itens[ajuste.k];
    if (!it){ return; }

    var subs = alt.substitutos || [];
    var pu = porUnidade(it);

    var html = '<button class="fechar" onclick="__fechar()">&times;</button>'
      + '<div class="puxador"></div>'
      + '<h2>'+esc(it.nome)+'</h2>'
      + '<div class="sub">'+esc(ajuste.p)+' — '+esc(alt.titulo)+'</div>'
      + '<div class="aj-macros">'+rd(num(it.cal))+' cal · '+rd(num(it.protein))+' g prot · '
      + rd(num(it.carb))+' g carb · '+rd(num(it.fats))+' g gord</div>';

    if (!it.semQtd && pu){
      html += '<div class="rot">Quantidade</div>'
        + '<div class="aj-qtd">'
        + '<button class="aj-b" data-d="-1">&minus;</button>'
        + '<input class="aj-i" type="number" inputmode="decimal" step="any" value="'+esc(String(num(it.qtd)))+'">'
        + '<span class="aj-u">'+esc(it.unidade||"")+'</span>'
        + '<button class="aj-b" data-d="1">+</button>'
        + '</div>';
    }

    html += '<div class="rot">Trocar por</div>';
    if (subs.length){
      html += '<div class="aj-subs">' + subs.map(function(s, i){
        return '<button class="aj-sub'+(s.nome === it.nome ? ' on' : '')+'" data-s="'+i+'">'
             + '<span>'+esc(s.nome)+'</span>'
             + '<small>'+rd(num(s.cal))+' cal / '+esc(s.unidade||"unidade")+'</small></button>';
      }).join("") + '</div>';
    } else {
      html += '<p style="color:#999">Sem substitutos definidos para esta opção.</p>';
    }

    if (it._orig){ html += '<button class="aj-reset">voltar ao original</button>'; }

    document.getElementById("folha").innerHTML = html;
    ligarAjuste(it);
  }

  function ligarAjuste(it){
    var folha = document.getElementById("folha");

    folha.querySelectorAll(".aj-b").forEach(function(b){
      b.onclick = function(){
        var q = num(it.qtd), d = parseInt(b.getAttribute("data-d"), 10);
        guardarOriginal(it);
        aplicarQtd(it, q + d*passo(q));
        it._mudou = true;
        depoisDeAjustar();
      };
    });

    var inp = folha.querySelector(".aj-i");
    if (inp){
      inp.onchange = function(){
        guardarOriginal(it);
        aplicarQtd(it, num(inp.value));
        it._mudou = true;
        depoisDeAjustar();
      };
    }

    folha.querySelectorAll(".aj-sub").forEach(function(b){
      b.onclick = function(){
        var alt = view[ajuste.p].lista[view[ajuste.p].ativa];
        trocar(it, (alt.substitutos || [])[parseInt(b.getAttribute("data-s"), 10)]);
        depoisDeAjustar();
      };
    });

    var rst = folha.querySelector(".aj-reset");
    if (rst){ rst.onclick = function(){ restaurar(it); depoisDeAjustar(); }; }
  }

  function depoisDeAjustar(){
    atualizarAlt(ajuste.p);
    renderAjuste();
  }

  window.__fechar = function(){ ajuste = null; document.getElementById("modal").classList.remove("on"); };
  document.getElementById("modal").addEventListener("click", function(e){ if (e.target === this){ window.__fechar(); } });

  // ---- carregar o estado do repositório ----
  var arquivo = param("e");
  if (!arquivo){
    document.getElementById("app").innerHTML = '<div class="aviso">Link inválido: falta o parâmetro do plano.</div>';
    return;
  }
  // segurança: só um nome de arquivo .json dentro de estados/
  arquivo = arquivo.replace(/^.*[\\/]/, "");
  if (!/\.json$/i.test(arquivo)){ arquivo += ".json"; }

  fetch("estados/" + encodeURIComponent(arquivo) + "?t=" + Date.now())
    .then(function(r){ if (!r.ok){ throw new Error(r.status); } return r.json(); })
    .then(function(estado){
      if (!estado || (!Array.isArray(estado.itens) && !estado.periodos)){ throw new Error("formato"); }
      view = normalizar(estado);
      render(estado);
    })
    .catch(function(){
      document.getElementById("app").innerHTML = '<div class="aviso">Não foi possível abrir este plano.<br>Confira o link ou tente de novo.</div>';
    });
})();
</script>
</body>
</html>
