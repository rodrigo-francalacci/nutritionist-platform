<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B25D4">
<title>Plano alimentar</title>
<style>
  :root{
    --cor1:#0A0A0B; --cor2:#0B25D4; --cor3:#41BAA4; --cor4:#ABDAFC;
    --cor5:#E5FCFF; --cor6:#EDEAE8; --cor7:#080824; --cor8:#E23E49;
  }
  /* No celular, um toque um pouco mais demorado virava seleção de texto, ou
     abria o "Look Up"/dicionário por cima do app. Aqui nada é para copiar —
     é tudo botão, lista e gesto —, então a seleção sai do caminho. O campo de
     quantidade é a exceção, logo abaixo. */
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent;
     -webkit-user-select:none; -moz-user-select:none; user-select:none;
     -webkit-touch-callout:none; }
  input{ -webkit-user-select:text; user-select:text; }
  html,body{ margin:0; padding:0; background:#f2f4f8; color:var(--cor1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body{ padding-bottom:84px; }        /* espaço p/ a barra fixa */
  .topo{ background:var(--cor7); color:#fff; padding:16px 16px 14px; }
  .topo h1{ margin:0; font-size:20px; }
  .topo .sub{ margin-top:2px; font-size:13px; color:var(--cor4); }
  .topo .geral{ margin-top:8px; font-size:13px; line-height:1.4; color:#dfe6ff; }
  .topo-linha{ display:flex; align-items:flex-start; gap:10px; }
  .topo-linha .tit{ flex:1 1 auto; min-width:0; }
  .topo-bts{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; }
  .btn-dias{ border:1px solid rgba(255,255,255,.35); background:transparent;
    color:#fff; border-radius:9px; padding:8px 11px; font-size:13px; cursor:pointer;
    white-space:nowrap; text-align:center; text-decoration:none; display:block; }
  .btn-dias:active{ background:rgba(255,255,255,.12); }
  .sync{ margin-top:8px; font-size:11px; color:#9fb0e8; min-height:14px; }
  .sync.erro{ color:#ffb4ba; }

  /* pé de cada período: instruções + acrescentar + "não comi" */
  .p-pe{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    flex-wrap:wrap; padding:4px 12px 6px; }
  .add-item{ flex:0 0 auto; border:1px solid var(--cor3); background:#fff; color:var(--cor3);
    border-radius:20px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
    white-space:nowrap; }
  .add-item:active{ background:#eefaf7; }
  .busca-folha{ width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--cor4);
    border-radius:10px; margin-bottom:8px; }
  /* alimento que a pessoa acrescentou hoje, fora do previsto */
  .food.acrescentado{ background:#f2fbf8; }
  .food.acrescentado .n::after{ content:"acrescentado"; margin-left:8px; font-size:10px;
    font-weight:700; color:#0d7a63; background:#cdf0e6; padding:1px 6px; border-radius:8px;
    vertical-align:middle; text-transform:uppercase; letter-spacing:.04em; }
  .instr{ flex:0 0 auto; border:1px solid var(--cor4); background:#fff; color:var(--cor2);
    border-radius:20px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
    white-space:nowrap; }
  .instr:active{ background:var(--cor5); }
  .nao-comi{ flex:0 0 auto; display:flex; align-items:center; gap:7px; cursor:pointer;
    font-size:13px; color:#7a828f; padding:6px 2px; white-space:nowrap; }
  .nao-comi input{ width:20px; height:20px; margin:0; accent-color:var(--cor8); }
  .nao-comi.on{ color:var(--cor8); font-weight:700; }
  /* refeição que a pessoa não comeu: sai da conta e fica apagada */
  .periodo.pulado .slide, .periodo.pulado .p-tot{ opacity:.4; }
  .periodo.pulado .p-tot{ text-decoration:line-through; }

  /* folha "meus dias" */
  .dia-l{ display:flex; align-items:baseline; gap:10px; padding:11px 2px;
    border-bottom:1px solid #f0f2f6; cursor:pointer; }
  .dia-l .d{ font-weight:700; font-size:15px; }
  .dia-l .hoje{ font-size:10px; background:var(--cor4); color:var(--cor2); padding:1px 6px;
    border-radius:8px; text-transform:uppercase; letter-spacing:.04em; font-weight:800; }
  .dia-l .c{ margin-left:auto; font-weight:700; color:var(--cor2); white-space:nowrap; }
  .dia-l .mm{ font-size:12px; color:#777; white-space:nowrap; }
  .dia-det{ background:#f7f9fc; border-radius:10px; padding:8px 12px; margin:2px 0 8px; font-size:13px; }
  .dia-det .pp{ font-weight:700; color:var(--cor2); margin-top:8px; }
  .dia-det .pp:first-child{ margin-top:2px; }
  .dia-det .ii{ display:flex; gap:8px; padding:2px 0; color:#333; }
  .dia-det .ii span:last-child{ margin-left:auto; color:#666; white-space:nowrap; }
  .dia-det .nao{ color:#999; font-style:italic; }
  .vazio-dias{ color:#999; padding:14px 2px; }

  /* seção "Extra": o que a pessoa comeu fora do plano */
  .cab-extra{ background:var(--cor6); }
  .extra-add{ padding:8px 12px 12px; display:flex; gap:8px; }
  .extra-txt{ flex:1 1 auto; min-width:0; padding:11px 12px; font-size:15px;
    border:1px solid var(--cor4); border-radius:10px; background:#fff; }
  .extra-b{ flex:0 0 auto; border:none; background:var(--cor2); color:#fff; border-radius:10px;
    padding:0 16px; font-size:15px; font-weight:700; cursor:pointer; }
  .extra-b:disabled{ opacity:.5; }
  .extra-dica{ font-size:12px; color:#9aa2b1; padding:0 14px 10px; }
  .extra-erro{ font-size:12px; color:var(--cor8); padding:0 14px 10px; }
  .extra-res{ max-height:280px; overflow-y:auto; padding:0 12px; }
  .res-b{ display:block; width:100%; text-align:left; padding:10px 12px; margin-bottom:6px;
    border:1px solid var(--cor4); background:#fff; border-radius:10px; font-size:15px; cursor:pointer; }
  .res-b b{ display:block; font-weight:600; }
  .res-b small{ color:#777; font-size:12px; }
  .extra-vazio{ color:#999; font-size:13px; padding:4px 2px 10px; }

  /* opções que a IA devolveu, para escolher qual é a certa */
  .pal{ display:flex; flex-direction:column; gap:6px; }
  .pal-b{ display:block; text-align:left; width:100%; padding:11px 12px; font-size:15px;
    border:1px solid var(--cor4); background:#fff; border-radius:10px; cursor:pointer; }
  .pal-b b{ display:block; }
  .pal-b small{ color:#777; font-size:12px; }

  .aj-remover{ margin-top:10px; width:100%; padding:11px; border:1px solid var(--cor8);
    background:#fff; color:var(--cor8); border-radius:10px; font-size:15px; cursor:pointer; }

  /* encerrar o dia */
  .fim{ margin:16px 10px 10px; }
  .fim-b{ width:100%; padding:14px; border:none; border-radius:12px; background:var(--cor3);
    color:#fff; font-size:16px; font-weight:800; cursor:pointer; }
  .fim-b:active{ opacity:.85; }
  .fim-dica{ text-align:center; font-size:12px; color:#9aa2b1; padding:8px 12px 0; }

  .aviso{ padding:40px 20px; text-align:center; color:#666; }

  .periodo{ margin:12px 10px; background:#fff; border-radius:14px; overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .p-cab{ display:flex; align-items:center; gap:8px; padding:10px 12px; }
  .p-nome{ font-weight:800; font-size:16px; }
  .cab-manha{ background:var(--cor5); }
  .cab-almoco{ background:var(--cor4); }
  .cab-tarde{ background:var(--cor3); }
  .cab-noite{ background:var(--cor2); color:#fff; }
  .p-tot{ margin-left:auto; font-size:13px; font-weight:700; opacity:.9; white-space:nowrap; }

  .alt-barra{ display:flex; align-items:center; gap:8px; padding:4px 12px 2px; font-size:13px; color:#333; }
  .cab-noite ~ .alt-barra{}
  .alt-seta{ border:none; background:rgba(0,0,0,.06); color:#333; border-radius:50%;
    width:26px; height:26px; font-size:14px; line-height:1; cursor:pointer; flex:0 0 auto; }
  .alt-seta:disabled{ opacity:.3; }
  .alt-nome{ font-weight:700; flex:1 1 auto; text-align:center; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .alt-cont{ color:#888; font-size:12px; }
  .dots{ display:flex; gap:5px; justify-content:center; padding:2px 0 6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:#cdd3dd; }
  .dot.on{ background:var(--cor2); width:16px; border-radius:4px; }

  .vp{ overflow:hidden; touch-action:pan-y; }        /* viewport do carrossel */
  .track{ display:flex; will-change:transform; }
  .slide{ flex:0 0 100%; min-width:100%; padding:2px 0 4px; }
  .food{ display:flex; align-items:baseline; gap:10px; padding:9px 14px; border-top:1px solid #f0f2f6;
    cursor:pointer; }
  .food:first-child{ border-top:none; }
  .food .n{ font-size:16px; }
  .food .q{ margin-left:auto; font-size:15px; font-weight:700; color:var(--cor2); white-space:nowrap; }
  .food.livre .q{ color:#777; font-weight:600; font-style:italic; }
  .food .ed{ color:#c3c9d4; font-size:15px; flex:0 0 auto; }
  /* alimento que o cliente trocou ou mediu diferente */
  .food.mudou{ background:#fffdf3; }
  .food.mudou .n::after{ content:"ajustado"; margin-left:8px; font-size:10px; font-weight:700;
    color:#a07800; background:#ffefc2; padding:1px 6px; border-radius:8px; vertical-align:middle;
    text-transform:uppercase; letter-spacing:.04em; }

  /* folha de ajuste (trocar alimento / mudar quantidade) */
  .aj-macros{ color:#666; font-size:13px; margin:2px 0 4px; }
  .aj-qtd{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .aj-b{ width:44px; height:44px; flex:0 0 auto; border:1px solid var(--cor4); background:var(--cor5);
    color:var(--cor2); font-size:22px; line-height:1; border-radius:10px; cursor:pointer; }
  .aj-b:active{ background:var(--cor4); }
  .aj-i{ width:96px; padding:10px; font-size:17px; text-align:center; border:1px solid var(--cor4);
    border-radius:10px; }
  .aj-u{ font-size:15px; color:#555; }
  .aj-subs{ display:flex; flex-direction:column; gap:6px; }
  .aj-sub{ display:flex; align-items:baseline; gap:10px; text-align:left; width:100%;
    padding:11px 12px; border:1px solid var(--cor4); background:#fff; border-radius:10px;
    font-size:15px; cursor:pointer; }
  .aj-sub small{ margin-left:auto; color:#777; font-size:12px; white-space:nowrap; }
  .aj-sub.on{ border-color:var(--cor2); background:var(--cor5); font-weight:700; }
  .aj-reset{ margin-top:14px; width:100%; padding:11px; border:1px solid var(--cor8);
    background:#fff; color:var(--cor8); border-radius:10px; font-size:15px; cursor:pointer; }
  .slide-vazio{ padding:18px 14px; color:#999; font-size:14px; }
  .toque{ text-align:center; font-size:12px; color:#9aa2b1; padding:4px 0 8px; }

  .barra{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--cor7);
    color:#fff; display:flex; justify-content:space-around; padding:10px 8px;
    box-shadow:0 -2px 12px rgba(0,0,0,.3); }
  .barra .m{ text-align:center; }
  .barra .m b{ display:block; font-size:17px; }
  .barra .m span{ font-size:11px; color:var(--cor4); text-transform:uppercase; letter-spacing:.03em; }

  /* modal de instruções */
  .modal{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:none; }
  .modal.on{ display:block; }
  .folha{ position:absolute; left:0; right:0; bottom:0; max-height:88%; overflow:auto;
    background:#fff; border-radius:16px 16px 0 0; padding:16px 18px 28px; }
  .folha h2{ margin:2px 0 2px; font-size:18px; }
  .folha .sub{ color:#777; font-size:13px; margin-bottom:12px; }
  .folha .lista{ margin:0 0 14px; }
  .folha .li{ display:flex; gap:10px; padding:6px 0; border-bottom:1px solid #f0f2f6; font-size:15px; }
  .folha .li .q{ margin-left:auto; font-weight:700; color:var(--cor2); }
  .folha .rot{ font-weight:800; font-size:13px; color:var(--cor2); text-transform:uppercase;
    letter-spacing:.04em; margin:10px 0 6px; }
  .folha p{ margin:0 0 10px; line-height:1.5; font-size:15px; }
  .folha .fechar{ position:sticky; top:0; float:right; border:none; background:#eef1f6;
    width:34px; height:34px; border-radius:50%; font-size:20px; cursor:pointer; }
  .puxador{ width:40px; height:4px; background:#d7dbe3; border-radius:2px; margin:0 auto 12px; }
</style>
</head>
<body>
  <div id="app"><div class="aviso">Carregando o plano…</div></div>

  <div class="barra" id="barra" style="display:none">
    <div class="m"><b id="b-prot">0</b><span>Proteína</span></div>
    <div class="m"><b id="b-carb">0</b><span>Carbo</span></div>
    <div class="m"><b id="b-gord">0</b><span>Gordura</span></div>
    <div class="m"><b id="b-cal">0</b><span>Calorias</span></div>
  </div>

  <div class="modal" id="modal">
    <div class="folha" id="folha"></div>
  </div>

<script src="diario-config.js?v=2026-08-04"></script>
<script src="diario.js?v=2026-08-04"></script>
<script src="ia-config.js?v=2026-08-04"></script>
<script src="ia.js?v=2026-08-04"></script>
<script>
(function(){
  var PERIODOS = ["Manhã","Almoço","Tarde","Noite"];
  var EXTRA = "Extra";                       // não vem do plano: é do dia
  var SLUG = { "Manhã":"manha","Almoço":"almoco","Tarde":"tarde","Noite":"noite","Extra":"extra" };
  var view = {};   // { periodo: {ativa, lista:[{titulo, notas, itens, totais}]} }

  function num(v){ var n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; }
  function rd(n){ return Math.round(n*10)/10; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function param(k){ try { return new URLSearchParams(location.search).get(k); } catch(e){ return null; } }

  function totaisDe(itens){
    var t = {cal:0,protein:0,carb:0,fats:0};
    (itens||[]).forEach(function(it){
      t.cal += num(it.cal); t.protein += num(it.protein); t.carb += num(it.carb); t.fats += num(it.fats);
    });
    return {cal:rd(t.cal), protein:rd(t.protein), carb:rd(t.carb), fats:rd(t.fats)};
  }

  // aceita v2 (estado.periodos) e o formato antigo (itens[] achatado)
  function normalizar(estado){
    var out = {};
    if (estado.periodos && typeof estado.periodos === "object"){
      PERIODOS.forEach(function(p){
        var src = estado.periodos[p];
        var lista = (src && Array.isArray(src.lista) && src.lista.length) ? src.lista : [{titulo:"Opção 1", notas:[], itens:[]}];
        out[p] = {
          ativa: Math.min(Math.max(0, (src && src.ativa)|0), lista.length-1),
          lista: lista.map(function(a,i){ return {
            titulo: (a && a.titulo) ? String(a.titulo) : ("Opção "+(i+1)),
            notas: (a && Array.isArray(a.notas)) ? a.notas : [],
            itens: (a && Array.isArray(a.itens)) ? a.itens : [],
            substitutos: (a && Array.isArray(a.substitutos)) ? a.substitutos : [],
            totais: totaisDe(a && a.itens)
          };})
        };
      });
    } else {
      var np = (estado.notasPlano && typeof estado.notasPlano === "object") ? estado.notasPlano : {};
      PERIODOS.forEach(function(p){ out[p] = {ativa:0, lista:[{titulo:"Opção 1", notas:(Array.isArray(np[p])?np[p]:[]), itens:[], substitutos:[], totais:null}]}; });
      (estado.itens||[]).forEach(function(it){ var p = out[it.refeicao] ? it.refeicao : "Manhã"; out[p].lista[0].itens.push(it); });
      PERIODOS.forEach(function(p){ out[p].lista[0].totais = totaisDe(out[p].lista[0].itens); });
    }
    return out;
  }

  function qtdTexto(it){
    if (it.semQtd){ return String(it.qtd||"").trim() || "à vontade"; }
    return (String(it.qtd||"").trim() + " " + (it.unidade||"")).trim();
  }

  function linhasHTML(alt){
    if (!alt.itens.length){ return '<div class="slide-vazio">Nada nesta opção.</div>'; }
    return alt.itens.map(function(it, k){
      return '<div class="food'+(it.semQtd?' livre':'')+(it._mudou?' mudou':'')+(it._add?' acrescentado':'')+'" data-k="'+k+'">'
           + '<span class="n">'+esc(it.nome)+'</span>'
           + '<span class="q">'+esc(qtdTexto(it))+'</span>'
           + '<span class="ed">&#8250;</span></div>';
    }).join("");
  }

  function slideHTML(alt){ return '<div class="slide">'+linhasHTML(alt)+'</div>'; }

  // ---- ajustar um alimento (trocar / mudar a quantidade) ----

  // Macros POR UNIDADE. O plano guarda o total (qtd x unidade) e, quase sempre,
  // o _base com o valor unitário; sem ele, dá para derivar do total/qtd. Fica
  // guardado em _pu na primeira vez: depois do primeiro ajuste o total já mudou
  // e dividir de novo daria outro número.
  function porUnidade(it){
    if (it._pu){ return it._pu; }
    var b = it._base;
    if (b && b.cal != null){
      it._pu = {cal:num(b.cal), protein:num(b.protein), carb:num(b.carb), fats:num(b.fats)};
      return it._pu;
    }
    var q = num(it.qtd);
    if (q > 0){
      it._pu = {cal:num(it.cal)/q, protein:num(it.protein)/q, carb:num(it.carb)/q, fats:num(it.fats)/q};
      return it._pu;
    }
    return null;
  }

  function guardarOriginal(it){
    if (it._orig){ return; }
    it._orig = {nome:it.nome, unidade:it.unidade, qtd:it.qtd, cal:it.cal, protein:it.protein,
                carb:it.carb, fats:it.fats, semQtd:it.semQtd, pu:porUnidade(it)};
  }

  function aplicarQtd(it, q){
    var pu = porUnidade(it);
    if (!pu){ return false; }
    q = Math.max(0, Math.round(q*100)/100);
    it.qtd = String(q);
    it.cal = rd(pu.cal*q); it.protein = rd(pu.protein*q);
    it.carb = rd(pu.carb*q); it.fats = rd(pu.fats*q);
    return true;
  }

  // passo do +/- conforme a ordem de grandeza: 200 g anda de 25 em 25, 2 ovos de meio em meio
  function passo(q){
    if (q >= 100){ return 25; }
    if (q >= 50){ return 10; }
    if (q >= 20){ return 5; }
    if (q >= 5){ return 1; }
    return 0.5;
  }

  function trocar(it, sub){
    if (!sub){ return; }
    guardarOriginal(it);
    var mesmaUnidade = String(sub.unidade||"") === String(it.unidade||"");
    var q = mesmaUnidade ? num(it.qtd) : 1;     // unidade diferente: 200 g -> 200 colheres não faz sentido
    if (!(q > 0)){ q = 1; }
    it.nome = sub.nome;
    it.unidade = sub.unidade || "";
    it.semQtd = false;
    it._pu = {cal:num(sub.cal), protein:num(sub.protein), carb:num(sub.carb), fats:num(sub.fats)};
    aplicarQtd(it, q);
    it._mudou = true;
  }

  function restaurar(it){
    var o = it._orig;
    if (!o){ return; }
    it.nome=o.nome; it.unidade=o.unidade; it.qtd=o.qtd; it.cal=o.cal;
    it.protein=o.protein; it.carb=o.carb; it.fats=o.fats; it.semQtd=o.semQtd;
    it._pu = o.pu;
    it._mudou = false;
    delete it._orig;
  }

  // Redesenha a opção ativa de um período e refaz os totais (do período e do dia).
  function atualizarAlt(p){
    if (p === EXTRA){ renderExtra(); atualizarTotais(); return; }   // o Extra não tem carrossel
    var alts = view[p]; if (!alts || !alts._sec){ return; }
    var i = alts.ativa, alt = alts.lista[i];
    alt.totais = totaisDe(alt.itens);
    var slides = alts._sec.querySelectorAll(".slide");
    if (slides[i]){ slides[i].innerHTML = linhasHTML(alt); }
    atualizarCab(p, alts._sec);
    atualizarTotais();
  }

  function render(estado){
    document.title = estado.nome || "Plano alimentar";
    var app = document.getElementById("app");
    app.innerHTML = "";

    var topo = document.createElement("div");
    topo.className = "topo";
    var geral = (estado.notasPlano && Array.isArray(estado.notasPlano.geral)) ? estado.notasPlano.geral.filter(function(s){return String(s).trim();}) : [];
    topo.innerHTML = '<div class="topo-linha"><div class="tit">' +
      '<h1>'+esc(estado.nome||"Plano alimentar")+'</h1>' +
      (estado.notas ? '<div class="sub">'+esc(estado.notas)+'</div>' : "") +
      '</div><div class="topo-bts">' +
      '<button class="btn-dias">&#128197; meus dias</button>' +
      '<a class="btn-dias" href="compras.html?e=' + encodeURIComponent(arquivo) + '">&#128722; compras</a>' +
      '</div></div>' +
      (geral.length ? '<div class="geral">'+geral.map(esc).join("<br>")+'</div>' : "") +
      '<div class="sync" id="sync"></div>';
    app.appendChild(topo);
    topo.querySelector(".btn-dias").addEventListener("click", abrirDias);

    PERIODOS.forEach(function(p){
      var alts = view[p];
      var temAlgo = alts.lista.some(function(a){ return a.itens.length || (a.notas||[]).some(function(s){return String(s).trim();}); });
      if (!temAlgo){ return; }   // pula período totalmente vazio

      var sec = document.createElement("div");
      sec.className = "periodo";
      sec.setAttribute("data-p", p);
      var n = alts.lista.length;
      sec.innerHTML =
        '<div class="p-cab cab-'+SLUG[p]+'"><span class="p-nome">'+esc(p)+'</span><span class="p-tot" id="ptot-'+SLUG[p]+'"></span></div>' +
        (n>1 ? '<div class="alt-barra"><button class="alt-seta" data-dir="-1">&#8249;</button>'
             + '<span class="alt-nome"></span><button class="alt-seta" data-dir="1">&#8250;</button></div>'
             + '<div class="dots"></div>'
             : '<div class="alt-barra"><span class="alt-nome" style="text-align:center"></span></div>') +
        '<div class="vp"><div class="track">'+alts.lista.map(slideHTML).join("")+'</div></div>' +
        '<div class="p-pe">' +
        '<button class="instr">&#128214; instruções</button>' +
        '<button class="add-item">+ alimento</button>' +
        '<label class="nao-comi"><input type="checkbox"><span>não comi</span></label></div>' +
        '<div class="toque">toque num alimento para ajustar a quantidade</div>';
      app.appendChild(sec);
      alts._sec = sec;
      montarCarrossel(p, sec);
    });

    montarExtra(app);
    montarFimDoDia(app);

    document.getElementById("barra").style.display = "flex";
    atualizarTotais();
  }

  // ---- base de alimentos para o Extra -------------------------------------
  // As mesmas bases que o editor usa, já publicadas neste repositório: 74 da
  // base pessoal + ~558 da TACO. São ~180 KB, então só descem quando a pessoa
  // usa a busca pela primeira vez — quem só olha o plano não paga por isso.

  var TACO_ARQUIVOS = ["bebidas.json","carnes_e_derivados.json","cereais_e_derivados.json",
    "frutas_e_derivados.json","leguminosas_e_derivados.json","leite_e_derivados.json",
    "nozes_castanhas_e_outros.json","ovos_e_derivados.json","pescados_e_frutos_do_mar.json",
    "produtos_acucarados.json","verduras_hortalicas_e_derivados.json","oleos_e_gorduras.json"];

  var baseAlimentos = null;      // null enquanto não carregou
  var basePedido = null;

  function normalizarAlimento(f, origem){
    if (!f || !String(f.nome || "").trim()){ return null; }
    return {
      nome: String(f.nome),
      unidade: String(f.unidade || "unidade"),
      cal: num(f.cal), protein: num(f.protein), carb: num(f.carb), fats: num(f.fats),
      detalhes: String(f.detalhes || ""),
      origem: origem
    };
  }

  function carregarBase(){
    if (baseAlimentos){ return Promise.resolve(baseAlimentos); }
    if (basePedido){ return basePedido; }

    var pedidos = [
      fetch("foods.json").then(function(r){ return r.json(); })
        .then(function(j){ return (j || []).map(function(f){ return normalizarAlimento(f, "minha base"); }); })
        .catch(function(){ return []; })
    ];

    // um grupo com problema não pode derrubar a busca inteira, só aquele grupo
    TACO_ARQUIVOS.forEach(function(a){
      pedidos.push(
        fetch("tabela_taco/" + a).then(function(r){ return r.json(); })
          .then(function(j){ return (j.Plan1 || []).map(function(f){ return normalizarAlimento(f, "TACO"); }); })
          .catch(function(){ return []; })
      );
    });

    basePedido = Promise.all(pedidos).then(function(partes){
      var todos = [];
      partes.forEach(function(p){ (p || []).forEach(function(f){ if (f){ todos.push(f); } }); });
      baseAlimentos = todos;
      return todos;
    });
    return basePedido;
  }

  // "maçã" e "maca" têm de achar a mesma coisa: ninguém digita acento no celular
  function chave(s){
    return String(s == null ? "" : s).toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function buscarAlimento(termo){
    var t = chave(termo).trim();
    if (t.length < 2 || !baseAlimentos){ return []; }
    var palavras = t.split(/\s+/);

    var achados = baseAlimentos.filter(function(f){
      var n = chave(f.nome);
      return palavras.every(function(p){ return n.indexOf(p) >= 0; });
    });

    // quem começa com o que foi digitado vem antes; depois, nome mais curto
    achados.sort(function(a, b){
      var ca = chave(a.nome).indexOf(palavras[0]) === 0 ? 0 : 1;
      var cb = chave(b.nome).indexOf(palavras[0]) === 0 ? 0 : 1;
      if (ca !== cb){ return ca - cb; }
      return a.nome.length - b.nome.length;
    });

    return achados.slice(0, 20);
  }

  // 100 g / 100 ml é a porção com que se pensa; o resto começa em 1
  function qtdPadrao(unidade){
    var u = chave(unidade);
    return (u.indexOf("grama") >= 0 || u === "ml" || u.indexOf("mililitro") >= 0) ? 100 : 1;
  }

  // Liga um campo de texto + uma caixa de resultados à busca na base. É a mesma
  // busca no Extra (embutida no cartão) e no "+ alimento" de cada refeição
  // (numa folha) — muda só quem recebe o alimento escolhido.
  function ligarBusca(campo, res, aoEscolher){
    var espera = null;

    function mostrar(){
      var termo = campo.value.trim();
      if (termo.length < 2){ res.innerHTML = ""; return; }

      carregarBase().then(function(){
        if (campo.value.trim() !== termo){ return; }   // já digitou outra coisa
        var achados = buscarAlimento(termo);
        if (!achados.length){
          res.innerHTML = '<div class="extra-vazio">Nada encontrado. ' +
            (IA.ligada() ? 'Toque no “?” para eu tentar adivinhar.'
                         : 'Vale a pena acrescentar este alimento à sua base, no editor.') + '</div>';
          return;
        }
        res.innerHTML = achados.map(function(f, i){
          return '<button class="res-b" data-i="'+i+'"><b>'+esc(f.nome)+'</b>' +
                 '<small>'+rd(f.cal)+' cal por '+esc(f.unidade)+' · '+esc(f.origem)+'</small></button>';
        }).join("");
        res.querySelectorAll(".res-b").forEach(function(b){
          b.onclick = function(){
            var f = achados[parseInt(b.getAttribute("data-i"), 10)];
            campo.value = ""; res.innerHTML = "";
            aoEscolher(f);
          };
        });
      }, function(){
        res.innerHTML = '<div class="extra-vazio">Não consegui carregar a base de alimentos.</div>';
      });
    }

    campo.addEventListener("input", function(){
      clearTimeout(espera);
      espera = setTimeout(mostrar, 180);
    });
    campo.addEventListener("focus", carregarBase);   // adianta o download
  }

  // "+ alimento": o que a pessoa comeu ALÉM do previsto naquela refeição —
  // o azeite que ela pôs na salada, o pão que veio junto. Vale só para hoje.
  function abrirBuscaPara(p){
    var alts = view[p]; if (!alts){ return; }
    var alt = alts.lista[alts.ativa];

    document.getElementById("folha").innerHTML =
      '<button class="fechar" onclick="__fechar()">&times;</button>' +
      '<div class="puxador"></div>' +
      '<h2>Acrescentar em ' + esc(p) + '</h2>' +
      '<div class="sub">' + esc(alt.titulo) + ' — entra só no dia de hoje; o seu plano não muda.</div>' +
      '<input class="busca-folha" type="text" placeholder="procurar: azeite, pão, queijo…">' +
      '<div class="extra-res"></div>';

    var f = document.getElementById("folha");
    ligarBusca(f.querySelector(".busca-folha"), f.querySelector(".extra-res"), function(alimento){
      window.__fechar();
      adicionarItem(p, alimento);
    });
    document.getElementById("modal").classList.add("on");
    f.querySelector(".busca-folha").focus();
  }

  // Acrescenta um alimento à lista ATIVA de um período (ou ao Extra). O item
  // fica marcado com _add: é o que permite devolvê-lo ao recarregar e tirá-lo
  // quando o dia acaba, sem nunca encostar no plano.
  function adicionarItem(p, f, qtd){
    var alts = view[p]; if (!alts){ return; }
    var alt = alts.lista[alts.ativa];
    var q = (qtd === undefined) ? qtdPadrao(f.unidade) : qtd;

    var it = {
      nome: f.nome, unidade: f.unidade, semQtd: false, detalhes: f.detalhes || "",
      _pu: { cal:num(f.cal), protein:num(f.protein), carb:num(f.carb), fats:num(f.fats) },
      _add: true
    };
    aplicarQtd(it, q > 0 ? q : 1);
    alt.itens.push(it);

    atualizarAlt(p);
    salvarDia();
    // a porção quase nunca é a padrão: já abre para acertar
    abrirAjuste(p, alt.itens.length - 1);
  }

  function removerItem(p, k){
    var alts = view[p]; if (!alts){ return; }
    alts.lista[alts.ativa].itens.splice(k, 1);
    atualizarAlt(p);
    salvarDia();
  }

  // ---- seção "Extra" ------------------------------------------------------
  // Uma lista à parte, que não vem do plano: a pessoa procura o que comeu nas
  // bases que já vêm com o app e acerta a quantidade. Cai na mesma estrutura
  // das outras listas, então ajustar e recalcular funciona sem código novo.
  //
  // Se um dia houver um proxy configurado (ia-config.js), aparece também o
  // botão de perguntar por escrito — a busca continua sendo o caminho rápido.

  function montarExtra(app){
    view[EXTRA] = view[EXTRA] || { ativa:0, lista:[{titulo:EXTRA, notas:[], itens:[], substitutos:[], totais:totaisDe([])}] };

    var sec = document.createElement("div");
    sec.className = "periodo";
    sec.setAttribute("data-p", EXTRA);
    sec.innerHTML =
      '<div class="p-cab cab-extra"><span class="p-nome">Extra</span>' +
      '<span class="p-tot" id="ptot-extra"></span></div>' +
      '<div class="vp"><div class="track"><div class="slide"></div></div></div>' +
      '<div class="extra-add">' +
      '<input class="extra-txt" type="text" placeholder="procurar: cerveja, banana, pão…">' +
      (IA.ligada() ? '<button class="extra-b" title="perguntar por escrito">?</button>' : '') +
      '</div>' +
      '<div class="extra-res"></div>' +
      '<div class="extra-dica">procure o que você comeu e ajuste a quantidade</div>';
    app.appendChild(sec);

    view[EXTRA]._sec = sec;

    var campo = sec.querySelector(".extra-txt");
    var res = sec.querySelector(".extra-res");

    ligarBusca(campo, res, function(f){ adicionarItem(EXTRA, f); });

    var botao = sec.querySelector(".extra-b");
    if (botao){
      botao.addEventListener("click", function(){
        var txt = campo.value.trim();
        if (!txt){ return; }
        botao.disabled = true;
        mostrarDicaExtra("pensando…", false);
        IA.adivinhar(txt).then(function(opcoes){
          botao.disabled = false;
          mostrarDicaExtra("procure o que você comeu e ajuste a quantidade", false);
          if (!opcoes.length){ mostrarDicaExtra("não entendi isso como comida ou bebida", true); return; }
          campo.value = ""; res.innerHTML = "";
          escolherPalpite(opcoes);
        }, function(e){
          botao.disabled = false;
          mostrarDicaExtra("não consegui perguntar (" + e.message + ")", true);
        });
      });
    }

    // toque num item do Extra abre o mesmo ajuste das outras listas
    var vp = sec.querySelector(".vp");
    vp.addEventListener("click", function(e){
      var f = e.target.closest ? e.target.closest(".food") : null;
      if (f){ abrirAjuste(EXTRA, parseInt(f.getAttribute("data-k"), 10)); }
    });

    renderExtra();
  }

  function mostrarDicaExtra(txt, erro){
    var d = view[EXTRA]._sec.querySelector(".extra-dica");
    d.textContent = txt;
    d.className = erro ? "extra-erro" : "extra-dica";
  }

  function renderExtra(){
    var alts = view[EXTRA]; if (!alts || !alts._sec){ return; }
    var alt = alts.lista[0];
    alt.totais = totaisDe(alt.itens);
    alts._sec.querySelector(".slide").innerHTML = alt.itens.length
      ? linhasHTML(alt)
      : '<div class="slide-vazio">Nada por enquanto.</div>';
    var tot = document.getElementById("ptot-extra");
    if (tot){ tot.textContent = alt.totais.cal ? (alt.totais.cal + " cal") : ""; }
  }

  // A IA devolve até 3 leituras da mesma frase; quem decide é quem comeu.
  function escolherPalpite(opcoes){
    if (opcoes.length === 1){ adicionarItem(EXTRA, opcoes[0], opcoes[0].qtd); return; }

    document.getElementById("folha").innerHTML =
      '<button class="fechar" onclick="__fechar()">&times;</button>' +
      '<div class="puxador"></div>' +
      '<h2>Qual deles?</h2>' +
      '<div class="sub">Escolha o mais parecido — dá para acertar a quantidade depois.</div>' +
      '<div class="pal">' + opcoes.map(function(o, i){
        return '<button class="pal-b" data-o="'+i+'"><b>'+esc(o.nome)+'</b>' +
               '<small>'+rd(o.qtd)+' '+esc(o.unidade)+' · '+rd(o.cal*o.qtd)+' cal · P '+rd(o.protein*o.qtd)+
               ' · C '+rd(o.carb*o.qtd)+' · G '+rd(o.fats*o.qtd)+'</small></button>';
      }).join("") + '</div>';

    document.getElementById("folha").querySelectorAll(".pal-b").forEach(function(b){
      b.onclick = function(){
        window.__fechar();
        (function(o){ adicionarItem(EXTRA, o, o.qtd); })(opcoes[parseInt(b.getAttribute("data-o"), 10)]);
      };
    });
    document.getElementById("modal").classList.add("on");
  }


  // ---- encerrar o dia -----------------------------------------------------

  function montarFimDoDia(app){
    var div = document.createElement("div");
    div.className = "fim";
    div.innerHTML = '<button class="fim-b"></button><div class="fim-dica"></div>';
    app.appendChild(div);
    div.querySelector(".fim-b").addEventListener("click", encerrarDia);
    window._fim = div;
    atualizarFimDoDia();
  }

  function atualizarFimDoDia(){
    if (!window._fim){ return; }
    var b = window._fim.querySelector(".fim-b");
    var d = window._fim.querySelector(".fim-dica");
    var data = (diario && diario.aberto && diario.aberto.data) || hoje;
    b.textContent = "encerrar o dia " + dataBonita(data);
    d.textContent = "só o total vai para o histórico · se você esquecer, "
                  + "o dia fecha sozinho às 4:30";
  }

  function montarCarrossel(p, sec){
    var alts = view[p];
    var n = alts.lista.length;
    var vp = sec.querySelector(".vp");
    var track = sec.querySelector(".track");
    var w = vp.clientWidth;

    function setX(px, anim){ track.style.transition = anim ? "transform .28s ease-out" : "none"; track.style.transform = "translateX("+px+"px)"; }
    function irPara(i, anim){
      var antes = alts.ativa;
      alts.ativa = Math.max(0, Math.min(n-1, i));
      setX(-alts.ativa*w, anim);
      atualizarCab(p, sec);
      atualizarTotais();
      if (alts.ativa !== antes){ salvarDia(); }   // a opção escolhida faz parte do dia
    }
    sec._irPara = irPara;

    // navegação por setas
    sec.querySelectorAll(".alt-seta").forEach(function(b){
      b.addEventListener("click", function(){ irPara(alts.ativa + parseInt(b.getAttribute("data-dir"),10), true); });
    });

    // arrastar (swipe estilo Instagram) — pointer events cobrem toque e mouse
    var startX=0, startY=0, drag=false, dxTot=0, dyTot=0, base=0, decidiu=false, horiz=false, alvoTap=null;
    vp.addEventListener("pointerdown", function(e){
      w = vp.clientWidth; drag=true; decidiu=false; horiz=false;
      startX=e.clientX; startY=e.clientY; dxTot=0; dyTot=0; base=-alts.ativa*w;
      alvoTap = e.target;      // um toque no alimento ajusta; fora dele, abre as instruções
      setX(base, false);
    });
    vp.addEventListener("pointermove", function(e){
      if (!drag) return;
      dxTot = e.clientX - startX; dyTot = e.clientY - startY;
      if (!decidiu && (Math.abs(dxTot)>6 || Math.abs(dyTot)>6)){ decidiu=true; horiz = Math.abs(dxTot) > Math.abs(dyTot); }
      if (decidiu && horiz && n>1){
        try{ vp.setPointerCapture(e.pointerId); }catch(_){}
        e.preventDefault();
        var off = dxTot;
        // resistência nas pontas
        if ((alts.ativa===0 && off>0) || (alts.ativa===n-1 && off<0)){ off = off*0.35; }
        setX(base + off, false);
      }
    });
    function soltar(){
      if (!drag) return;
      drag=false;
      if (!decidiu || (!horiz && Math.abs(dxTot)<8 && Math.abs(dyTot)<8)){
        if (Math.abs(dxTot)<8 && Math.abs(dyTot)<8){                          // toque
          // só o alimento reage ao toque; as instruções têm botão próprio
          var f = (alvoTap && alvoTap.closest) ? alvoTap.closest(".food") : null;
          if (f){ abrirAjuste(p, parseInt(f.getAttribute("data-k"), 10)); }
        }
        setX(-alts.ativa*w, true);
        return;
      }
      if (horiz && n>1){
        var lim = Math.min(70, w*0.18);
        if (dxTot < -lim) irPara(alts.ativa+1, true);
        else if (dxTot > lim) irPara(alts.ativa-1, true);
        else irPara(alts.ativa, true);
      } else {
        setX(-alts.ativa*w, true);
      }
    }
    vp.addEventListener("pointerup", soltar);

    // Um pointercancel NÃO é um toque. Ao rolar a página, o navegador assume o
    // gesto e cancela o ponteiro — muitas vezes antes de qualquer pointermove,
    // então dxTot/dyTot ainda são 0 e isto passava por "toque". Era essa a
    // origem das instruções abrindo sozinhas durante a rolagem.
    vp.addEventListener("pointercancel", function(){
      if (!drag){ return; }
      drag = false;
      setX(-alts.ativa*w, true);
    });

    // o pé fica FORA do .vp, então não passa pelos handlers de toque acima
    var binstr = sec.querySelector(".instr");
    if (binstr){ binstr.addEventListener("click", function(){ abrirInstrucoes(p); }); }

    var badd = sec.querySelector(".add-item");
    if (badd){ badd.addEventListener("click", function(){ abrirBuscaPara(p); }); }

    var cx = sec.querySelector(".nao-comi input");
    if (cx){
      cx.addEventListener("change", function(){
        alts.naoComi = cx.checked;
        atualizarNaoComi(p);
        atualizarTotais();      // pulou a refeição: sai da conta do dia
        salvarDia();
      });
    }
    atualizarNaoComi(p);

    window.addEventListener("resize", function(){ w = vp.clientWidth; setX(-alts.ativa*w, false); });
    atualizarCab(p, sec);   // preenche o cabeçalho já na carga
    requestAnimationFrame(function(){ w = vp.clientWidth; setX(-alts.ativa*w, false); });
  }

  function atualizarCab(p, sec){
    var alts = view[p]; var n = alts.lista.length; var i = alts.ativa;
    var atual = alts.lista[i];
    var nomeEl = sec.querySelector(".alt-nome");
    if (nomeEl){ nomeEl.textContent = atual.titulo + (n>1 ? "  ("+(i+1)+"/"+n+")" : ""); }
    var tot = document.getElementById("ptot-"+SLUG[p]);
    if (tot){ tot.textContent = atual.totais.cal + " cal"; }
    var setas = sec.querySelectorAll(".alt-seta");
    if (setas[0]) setas[0].disabled = (i===0);
    if (setas[1]) setas[1].disabled = (i===n-1);
    var dots = sec.querySelector(".dots");
    if (dots){
      dots.innerHTML = "";
      for (var k=0;k<n;k++){ var d=document.createElement("span"); d.className="dot"+(k===i?" on":""); dots.appendChild(d); }
    }
  }

  function atualizarTotais(){
    var t = totaisDoDia();
    document.getElementById("b-prot").textContent = rd(t.protein) + "g";
    document.getElementById("b-carb").textContent = rd(t.carb) + "g";
    document.getElementById("b-gord").textContent = rd(t.fats) + "g";
    document.getElementById("b-cal").textContent = rd(t.cal);
  }

  function abrirInstrucoes(p){
    var alts = view[p]; var atual = alts.lista[alts.ativa];
    var foods = atual.itens.map(function(it){
      return '<div class="li"><span>'+esc(it.nome)+'</span><span class="q">'+esc(qtdTexto(it))+'</span></div>';
    }).join("") || '<div class="li">Sem alimentos.</div>';
    var notas = (atual.notas||[]).filter(function(s){return String(s).trim();});
    var instr = notas.length ? notas.map(function(s){ return "<p>"+esc(s)+"</p>"; }).join("") : '<p style="color:#999">Sem instruções para esta opção.</p>';

    document.getElementById("folha").innerHTML =
      '<button class="fechar" onclick="__fechar()">&times;</button>' +
      '<div class="puxador"></div>' +
      '<h2>'+esc(p)+' — '+esc(atual.titulo)+'</h2>' +
      '<div class="sub">'+atual.totais.cal+' cal · '+atual.totais.protein+' g prot · '+atual.totais.carb+' g carb · '+atual.totais.fats+' g gord</div>' +
      '<div class="lista">'+foods+'</div>' +
      '<div class="rot">Instruções</div>' + instr;
    document.getElementById("modal").classList.add("on");
  }
  // ---- folha de ajuste de um alimento ----

  var ajuste = null;   // { p, k } — qual alimento está aberto

  function abrirAjuste(p, k){
    var alts = view[p]; if (!alts){ return; }
    var alt = alts.lista[alts.ativa];
    if (!alt.itens[k]){ return; }
    ajuste = { p:p, k:k };
    renderAjuste();
    document.getElementById("modal").classList.add("on");
  }

  function renderAjuste(){
    if (!ajuste){ return; }
    var alts = view[ajuste.p];
    var alt = alts.lista[alts.ativa];
    var it = alt.itens[ajuste.k];
    if (!it){ return; }

    var subs = alt.substitutos || [];
    var pu = porUnidade(it);

    var html = '<button class="fechar" onclick="__fechar()">&times;</button>'
      + '<div class="puxador"></div>'
      + '<h2>'+esc(it.nome)+'</h2>'
      + '<div class="sub">'+esc(ajuste.p)+' — '+esc(alt.titulo)+'</div>'
      + '<div class="aj-macros">'+rd(num(it.cal))+' cal · '+rd(num(it.protein))+' g prot · '
      + rd(num(it.carb))+' g carb · '+rd(num(it.fats))+' g gord</div>';

    if (!it.semQtd && pu){
      html += '<div class="rot">Quantidade</div>'
        + '<div class="aj-qtd">'
        + '<button class="aj-b" data-d="-1">&minus;</button>'
        + '<input class="aj-i" type="number" inputmode="decimal" step="any" value="'+esc(String(num(it.qtd)))+'">'
        + '<span class="aj-u">'+esc(it.unidade||"")+'</span>'
        + '<button class="aj-b" data-d="1">+</button>'
        + '</div>';
    }

    if (it._add){
      // item do Extra: não substitui nada do plano, mas dá para tirar da lista
      html += '<button class="aj-remover">tirar da lista</button>';
      document.getElementById("folha").innerHTML = html;
      ligarAjuste(it);
      return;
    }

    html += '<div class="rot">Trocar por</div>';
    if (subs.length){
      html += '<div class="aj-subs">' + subs.map(function(s, i){
        return '<button class="aj-sub'+(s.nome === it.nome ? ' on' : '')+'" data-s="'+i+'">'
             + '<span>'+esc(s.nome)+'</span>'
             + '<small>'+rd(num(s.cal))+' cal / '+esc(s.unidade||"unidade")+'</small></button>';
      }).join("") + '</div>';
    } else {
      html += '<p style="color:#999">Sem substitutos definidos para esta opção.</p>';
    }

    if (it._orig){ html += '<button class="aj-reset">voltar ao original</button>'; }

    document.getElementById("folha").innerHTML = html;
    ligarAjuste(it);
  }

  function ligarAjuste(it){
    var folha = document.getElementById("folha");

    folha.querySelectorAll(".aj-b").forEach(function(b){
      b.onclick = function(){
        var q = num(it.qtd), d = parseInt(b.getAttribute("data-d"), 10);
        guardarOriginal(it);
        aplicarQtd(it, q + d*passo(q));
        it._mudou = true;
        depoisDeAjustar();
      };
    });

    var inp = folha.querySelector(".aj-i");
    if (inp){
      inp.onchange = function(){
        guardarOriginal(it);
        aplicarQtd(it, num(inp.value));
        it._mudou = true;
        depoisDeAjustar();
      };
    }

    folha.querySelectorAll(".aj-sub").forEach(function(b){
      b.onclick = function(){
        var alt = view[ajuste.p].lista[view[ajuste.p].ativa];
        trocar(it, (alt.substitutos || [])[parseInt(b.getAttribute("data-s"), 10)]);
        depoisDeAjustar();
      };
    });

    var rst = folha.querySelector(".aj-reset");
    if (rst){ rst.onclick = function(){ restaurar(it); depoisDeAjustar(); }; }

    var rem = folha.querySelector(".aj-remover");
    if (rem){
      rem.onclick = function(){
        var p = ajuste.p, k = ajuste.k;
        window.__fechar();
        removerItem(p, k);
      };
    }
  }

  function depoisDeAjustar(){
    atualizarAlt(ajuste.p);
    renderAjuste();
    salvarDia();
  }

  // ---- diário: o que foi comido em cada dia -------------------------------

  // { v:2, plano, aberto: {dia em andamento, inteiro}, dias: {"AAAA-MM-DD": só os totais} }
  var diario = null;
  var hoje = dataDoDia(new Date());
  var salvarTimer = null;

  // O dia vira às 4:30 da manhã, não à meia-noite: jantar de sexta à 1h,
  // uma cerveja a mais, uma sobremesa — nada disso é sábado. É a MESMA regra
  // para tudo: qual dia está aberto, e quando ele fecha sozinho.
  var HORA_VIRADA = 4.5;   // 4:30

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function dataLocal(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

  // A que dia pertence este instante.
  function dataDoDia(agora){
    var d = new Date(agora.getTime());
    if (d.getHours() + d.getMinutes()/60 < HORA_VIRADA){ d.setDate(d.getDate() - 1); }
    return dataLocal(d);
  }

  // Quando é a próxima virada, em milissegundos a partir de agora.
  function faltaParaVirada(agora){
    var v = new Date(agora.getTime());
    v.setHours(Math.floor(HORA_VIRADA), Math.round((HORA_VIRADA % 1) * 60), 0, 0);
    if (v <= agora){ v.setDate(v.getDate() + 1); }
    return v.getTime() - agora.getTime();
  }
  function dataBonita(iso){
    var p = String(iso).split("-");
    return p.length === 3 ? (p[2]+"/"+p[1]) : iso;
  }

  function sync(txt, erro){
    var el = document.getElementById("sync");
    if (!el){ return; }
    el.textContent = txt || "";
    el.classList.toggle("erro", !!erro);
  }

  function atualizarNaoComi(p){
    var alts = view[p]; if (!alts || !alts._sec){ return; }
    var rot = alts._sec.querySelector(".nao-comi");
    var cx = alts._sec.querySelector(".nao-comi input");
    if (cx){ cx.checked = !!alts.naoComi; }
    if (rot){ rot.classList.toggle("on", !!alts.naoComi); }
    alts._sec.classList.toggle("pulado", !!alts.naoComi);
  }

  // A v1 guardava cada dia inteiro. Agora o histórico é só o total, então os
  // registros antigos são achatados na leitura — ninguém perde um dia, só o
  // detalhe do que foi comido nele.
  function migrar(doc){
    var novo = { v:2, plano: arquivo, aberto: null, dias: {} };
    if (!doc || typeof doc !== "object"){ return novo; }

    if (doc.aberto && doc.aberto.periodos){ novo.aberto = doc.aberto; }

    var dias = doc.dias || {};
    Object.keys(dias).forEach(function(d){
      var r = dias[d]; if (!r){ return; }
      var t = r.totais || r;               // v1: {periodos, totais}; v2: só os totais
      novo.dias[d] = { cal:num(t.cal), protein:num(t.protein), carb:num(t.carb),
                       fats:num(t.fats), em: r.em || null };
    });
    return novo;
  }

  // O dia EM ANDAMENTO fica inteiro (para reabrir e continuar). Ao encerrar,
  // vira só o total — foi o que se pediu: o histórico guarda o quanto, não o quê.
  function estadoDoDia(){
    var est = { data: (diario.aberto && diario.aberto.data) || hoje,
                em: new Date().toISOString(), periodos: {}, extra: [] };

    PERIODOS.forEach(function(p){
      var alts = view[p]; if (!alts){ return; }
      var alt = alts.lista[alts.ativa];
      est.periodos[p] = {
        alt: alts.ativa,
        naoComi: !!alts.naoComi,
        itens: alt.itens.map(function(it){
          var o = { nome: it.nome, qtd: it.qtd, unidade: it.unidade, semQtd: !!it.semQtd,
                    cal: num(it.cal), protein: num(it.protein), carb: num(it.carb), fats: num(it.fats) };
          if (it._add){
            o.add = true;
            o.detalhes = it.detalhes || "";
            o.pu = porUnidade(it);   // acrescentado não existe no plano: os macros vêm daqui
          }
          if (it._mudou){
            o.mudou = true;
            o.pu = porUnidade(it);   // sem isto, remontar um alimento trocado usaria o _base errado
          }
          return o;
        })
      };
    });

    var ex = view[EXTRA];
    if (ex){
      est.extra = ex.lista[0].itens.map(function(it){
        return { nome: it.nome, qtd: it.qtd, unidade: it.unidade, detalhes: it.detalhes || "",
                 cal: num(it.cal), protein: num(it.protein), carb: num(it.carb), fats: num(it.fats),
                 pu: porUnidade(it) };
      });
    }
    return est;
  }

  // Um número só para o dia: o que a barra de baixo mostra é exatamente o que
  // vai para o histórico. Conta tudo, menos as refeições marcadas "não comi";
  // o Extra sempre entra (ninguém anota ali o que não comeu).
  function totaisDoDia(){
    var t = {cal:0, protein:0, carb:0, fats:0};

    PERIODOS.forEach(function(p){
      var alts = view[p];
      if (!alts || alts.naoComi){ return; }
      var tt = alts.lista[alts.ativa].totais;
      t.cal+=tt.cal; t.protein+=tt.protein; t.carb+=tt.carb; t.fats+=tt.fats;
    });

    var ex = view[EXTRA];
    if (ex){
      var te = ex.lista[0].totais;
      t.cal+=te.cal; t.protein+=te.protein; t.carb+=te.carb; t.fats+=te.fats;
    }

    ["cal","protein","carb","fats"].forEach(function(k){ t[k] = rd(t[k]); });
    return t;
  }

  function salvarDia(){
    if (!diario){ return; }
    diario.aberto = estadoDoDia();

    clearTimeout(salvarTimer);
    sync("salvando…");
    salvarTimer = setTimeout(function(){
      Diario.salvar(arquivo, diario).then(
        function(){ sync(Diario.remoto ? "salvo" : "salvo só neste aparelho"); },
        function(e){ sync("não consegui salvar (" + e.message + ")", true); }
      );
    }, 700);
  }

  // Devolve à tela o dia que ficou aberto.
  function aplicarEstadoDoDia(est){
    if (!est){ return; }

    PERIODOS.forEach(function(p){
      var r = est.periodos && est.periodos[p], alts = view[p];
      if (!r || !alts){ return; }

      alts.ativa = Math.min(Math.max(0, r.alt|0), alts.lista.length - 1);
      alts.naoComi = r.naoComi !== undefined ? !!r.naoComi : !r.comi;

      var alt = alts.lista[alts.ativa];
      // o plano pode ter mudado desde então; só devolve se a lista bate
      // o que veio do plano é devolvido por posição; o que foi ACRESCENTADO
      // não tem posição no plano e é recolocado no fim
      var salvos = Array.isArray(r.itens) ? r.itens : [];
      var doPlano = salvos.filter(function(s){ return s && !s.add; });
      var extras  = salvos.filter(function(s){ return s && s.add; });

      // o plano pode ter mudado desde então; só devolve se a lista bate
      if (doPlano.length === alt.itens.length){
        doPlano.forEach(function(s, k){
          if (!s.mudou){ return; }
          var it = alt.itens[k];
          if (!it){ return; }
          guardarOriginal(it);
          it.nome = s.nome; it.unidade = s.unidade; it.qtd = s.qtd; it.semQtd = !!s.semQtd;
          it.cal = num(s.cal); it.protein = num(s.protein);
          it.carb = num(s.carb); it.fats = num(s.fats);
          it._pu = s.pu || null;
          it._mudou = true;
        });
      }

      alt.itens = alt.itens.filter(function(it){ return !it._add; });   // não duplica ao reaplicar
      extras.forEach(function(s){
        alt.itens.push({ nome:s.nome, qtd:s.qtd, unidade:s.unidade, semQtd:!!s.semQtd,
                         detalhes:s.detalhes||"", cal:num(s.cal), protein:num(s.protein),
                         carb:num(s.carb), fats:num(s.fats), _pu:s.pu||null, _add:true });
      });

      alt.totais = totaisDe(alt.itens);
    });

    if (Array.isArray(est.extra) && view[EXTRA]){
      view[EXTRA].lista[0].itens = est.extra.map(function(s){
        return { nome:s.nome, qtd:s.qtd, unidade:s.unidade, semQtd:false, detalhes:s.detalhes||"",
                 cal:num(s.cal), protein:num(s.protein), carb:num(s.carb), fats:num(s.fats),
                 _pu: s.pu || null, _add:true };
      });
    }
  }

  // Totais a partir do REGISTRO guardado, sem passar pela tela. É como o
  // fechamento automático conta o dia de ontem sem precisar desenhá-lo antes.
  function totaisDoRegistro(est){
    var t = {cal:0, protein:0, carb:0, fats:0};
    function somar(it){
      t.cal+=num(it.cal); t.protein+=num(it.protein);
      t.carb+=num(it.carb); t.fats+=num(it.fats);
    }
    PERIODOS.forEach(function(p){
      var r = est && est.periodos && est.periodos[p];
      if (!r || r.naoComi){ return; }
      (r.itens || []).forEach(somar);
    });
    ((est && est.extra) || []).forEach(somar);
    ["cal","protein","carb","fats"].forEach(function(k){ t[k] = rd(t[k]); });
    return t;
  }

  // Fecha sozinho o dia que ficou para trás: passou das 4:30 e ninguém apertou
  // o botão. Não pergunta nada — o dia já acabou, só falta registrar.
  function encerrarAtrasado(){
    if (!diario || !diario.aberto || !diario.aberto.data){ return false; }
    if (diario.aberto.data >= hoje){ return false; }   // ainda é o mesmo dia

    var data = diario.aberto.data;
    var t = totaisDoRegistro(diario.aberto);
    diario.dias[data] = { cal:t.cal, protein:t.protein, carb:t.carb, fats:t.fats,
                          em: new Date().toISOString(), auto: true };
    diario.aberto = null;

    Diario.salvar(arquivo, diario).then(
      function(){ sync("dia " + dataBonita(data) + " fechado sozinho (" + t.cal + " cal)"); },
      function(e){ sync("não consegui salvar (" + e.message + ")", true); }
    );
    return true;
  }

  function encerrarDia(){
    if (!diario){ return; }
    var data = (diario.aberto && diario.aberto.data) || hoje;
    var t = totaisDoDia();

    if (!t.cal){
      alert("O dia está zerado — todas as refeições estão marcadas como \"não comi\" e não há nada no Extra.");
      return;
    }
    if (!confirm("Encerrar o dia " + dataBonita(data) + " com " + t.cal + " cal?\n\n" +
                 "O histórico guarda só o total; a lista de hoje volta ao plano.")){ return; }

    diario.dias[data] = { cal:t.cal, protein:t.protein, carb:t.carb, fats:t.fats,
                          em: new Date().toISOString() };
    diario.aberto = null;
    hoje = dataDoDia(new Date());
    limparParaNovoDia();

    sync("salvando…");
    Diario.salvar(arquivo, diario).then(
      function(){ sync("dia " + dataBonita(data) + " encerrado"); },
      function(e){ sync("não consegui salvar (" + e.message + ")", true); }
    );
  }

  // Devolve a tela ao plano: sem ajustes, sem "não comi", sem Extra.
  function limparParaNovoDia(){
    PERIODOS.forEach(function(p){
      var alts = view[p]; if (!alts){ return; }
      alts.naoComi = false;
      alts.lista.forEach(function(alt){
        // o que foi acrescentado era só daquele dia: some junto com ele
        alt.itens = alt.itens.filter(function(it){ return !it._add; });
        alt.itens.forEach(function(it){ if (it._orig){ restaurar(it); } });
        alt.totais = totaisDe(alt.itens);
      });
      atualizarAlt(p);
      atualizarNaoComi(p);
    });
    if (view[EXTRA]){ view[EXTRA].lista[0].itens = []; renderExtra(); }
    atualizarTotais();
    atualizarFimDoDia();
  }

  // Com a página aberta a noite toda, a virada acontece na hora — sem esperar
  // o próximo carregamento.
  var viradaTimer = null;
  function armarVirada(){
    clearTimeout(viradaTimer);
    viradaTimer = setTimeout(function(){
      hoje = dataDoDia(new Date());
      if (encerrarAtrasado()){ limparParaNovoDia(); }
      atualizarFimDoDia();
      armarVirada();
    }, faltaParaVirada(new Date()) + 2000);   // 2 s de folga para não cair em cima da hora
  }

  function abrirDias(){
    var dias = diario ? Object.keys(diario.dias || {}).sort().reverse() : [];
    var aberto = diario && diario.aberto;

    var corpo = "";
    if (aberto){
      var ta = totaisDoDia();
      corpo += '<div class="dia-l">'
             + '<span class="d">'+esc(dataBonita(aberto.data))+'</span>'
             + '<span class="hoje">aberto</span>'
             + '<span class="mm">P '+rd(ta.protein)+' · C '+rd(ta.carb)+' · G '+rd(ta.fats)+'</span>'
             + '<span class="c">'+rd(ta.cal)+' cal</span></div>';
    }

    if (!dias.length && !aberto){
      corpo = '<div class="vazio-dias">Ainda não há nada aqui. Ajuste o que comeu, marque '
            + '<b>não comi</b> no que pulou, e toque em <b>encerrar o dia</b> — o total fica registrado.</div>';
    } else {
      corpo += dias.map(function(d){
        var t = diario.dias[d] || {};
        return '<div class="dia-l">'
             + '<span class="d">'+esc(dataBonita(d))+'</span>'
             + '<span class="mm">P '+rd(t.protein)+' · C '+rd(t.carb)+' · G '+rd(t.fats)+'</span>'
             + '<span class="c">'+rd(t.cal)+' cal</span></div>';
      }).join("");
    }

    document.getElementById("folha").innerHTML =
      '<button class="fechar" onclick="__fechar()">&times;</button>' +
      '<div class="puxador"></div>' +
      '<h2>Meus dias</h2>' +
      '<div class="sub">' + (Diario.remoto
          ? 'Salvo na sua conta — abre igual em qualquer aparelho.'
          : 'Salvo só neste aparelho por enquanto.') + '</div>' +
      corpo;

    document.getElementById("modal").classList.add("on");
  }

  window.__fechar = function(){ ajuste = null; document.getElementById("modal").classList.remove("on"); };
  document.getElementById("modal").addEventListener("click", function(e){ if (e.target === this){ window.__fechar(); } });

  // ---- instalar como app ----------------------------------------------
  // Cada plano tem o SEU manifest (manifests/<plano>.webmanifest), gerado pelo
  // tools/sessions.js. Tem de ser um por plano: o manifest só carrega um
  // "start_url", e os links dos clientes diferem justamente no "?e=" — com um
  // manifest só, o ícone instalado por todo mundo abriria o mesmo plano.
  function prepararInstalacao(arquivo){
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = "manifests/" + encodeURIComponent(arquivo.replace(/\.json$/i, "")) + ".webmanifest";
    document.head.appendChild(link);

    if (!navigator.serviceWorker){ return; }
    // sem service worker o Chrome não oferece "instalar"; e é ele que faz o
    // plano abrir sem sinal
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  // ---- carregar o estado do repositório ----
  var arquivo = param("e");
  if (!arquivo){
    document.getElementById("app").innerHTML = '<div class="aviso">Link inválido: falta o parâmetro do plano.</div>';
    return;
  }
  // segurança: só um nome de arquivo .json dentro de estados/
  arquivo = arquivo.replace(/^.*[\\/]/, "");
  if (!/\.json$/i.test(arquivo)){ arquivo += ".json"; }

  prepararInstalacao(arquivo);

  fetch("estados/" + encodeURIComponent(arquivo) + "?t=" + Date.now())
    .then(function(r){ if (!r.ok){ throw new Error(r.status); } return r.json(); })
    .then(function(estado){
      if (!estado || (!Array.isArray(estado.itens) && !estado.periodos)){ throw new Error("formato"); }
      view = normalizar(estado);
      render(estado);

      // o diário chega depois: a tela já está de pé e só é corrigida se houver
      // algo registrado hoje
      sync("carregando o diário…");
      return Diario.carregar(arquivo).then(function(doc){
        diario = migrar(doc);
        var fechou = encerrarAtrasado();   // antes de desenhar: o dia velho nem aparece

        if (diario.aberto){
          aplicarEstadoDoDia(diario.aberto);
          PERIODOS.forEach(function(p){
            if (!view[p] || !view[p]._sec){ return; }
            atualizarAlt(p);
            atualizarNaoComi(p);
            view[p]._sec.querySelector(".track").style.transform =
              "translateX(" + (-view[p].ativa * view[p]._sec.querySelector(".vp").clientWidth) + "px)";
          });
          renderExtra();
          atualizarTotais();
          sync("dia de hoje restaurado");
        } else if (!fechou){
          sync(Diario.remoto ? "" : "diário só neste aparelho");
        }
        atualizarFimDoDia();
        armarVirada();
      }, function(e){
        diario = migrar(null);
        sync("diário indisponível (" + e.message + ")", true);
      });
    })
    .catch(function(){
      document.getElementById("app").innerHTML = '<div class="aviso">Não foi possível abrir este plano.<br>Confira o link ou tente de novo.</div>';
    });
})();
</script>
</body>
</html>
